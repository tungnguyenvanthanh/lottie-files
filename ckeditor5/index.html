<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./ckeditor5.css">
</head>
<body>
  <div class="main-container">
    <div class="editor-container editor-container_classic-editor editor-container_include-block-toolbar editor-container_include-word-count editor-container_include-fullscreen" id="editor-container">
      <div class="editor-container__editor"><div id="editor"></div></div>
      <div class="editor_container__word-count" id="editor-word-count"></div>
    </div>
  </div>

  <script type="module">
    const version = Date.now();
    const allowedOrigins = ['https://ttvl.io.vn', 'https://xaydungmiendong.vn', 'https://localhost:7075'];
    const LICENSE_KEY = 'eyJhbGciOiJFUzI1NiJ9.eyJleHAiOjE3NDc5NTgzOTksImp0aSI6IjlhYTIzOGQ5LTVmZTgtNGRiNS1iZTQ2LWU5MDU1ZmQ5N2Q3YiIsInVzYWdlRW5kcG9pbnQiOiJodHRwczovL3Byb3h5LWV2ZW50LmNrZWRpdG9yLmNvbSIsImRpc3RyaWJ1dGlvbkNoYW5uZWwiOlsiY2xvdWQiLCJkcnVwYWwiLCJzaCJdLCJ3aGl0ZUxhYmVsIjp0cnVlLCJsaWNlbnNlVHlwZSI6InRyaWFsIiwiZmVhdHVyZXMiOlsiKiJdLCJ2YyI6ImFjYjc4MGYzIn0.r1HikNOx5SoDUmvMKh4zQdmPHZdmjc5fgbU5FFSgl8eX8AjfN8rf9NzLBeK-P8c6X-EZTB15nTe1RLugMxio7A';

    Promise.all([
      import(`./ckeditor5.js?v=${version}`),
      import(`./translations/vi.js?v=${version}`)
    ]).then(([m, translations]) => {
      const { ClassicEditor, WordCount, Fullscreen, Alignment, Bold, Italic, Link, ImageInsert, InsertImageViaUrl, TableToolbar, Paragraph, Heading, FontSize, FontColor, FontFamily, SpecialCharacters, Highlight, Indent, List, SourceEditing, FindAndReplace, ShowBlocks, Code, CodeBlock, HtmlEmbed, BlockQuote, RemoveFormat, Emoji, MediaEmbed, PageBreak, HorizontalLine, BlockToolbar, BalloonToolbar, Autosave, PasteFromOffice, GeneralHtmlSupport, ImageToolbar, ImageStyle, ImageResize, ImageTextAlternative, ImageCaption, ImageInline, ImageBlock, Table, TableProperties, TableCellProperties, TableColumnResize, TableCaption, Underline, Strikethrough, Subscript, Superscript, HtmlComment, Bookmark, PasteFromMarkdownExperimental, Mention, SimpleUploadAdapter } = m;

      const editorConfig = {
        plugins: [
          WordCount, Fullscreen, Alignment, Bold, Italic, Link, ImageInsert, InsertImageViaUrl, TableToolbar,
          Paragraph, Heading, FontSize, FontColor, FontFamily, SpecialCharacters, Highlight, Indent, List,
          SourceEditing, FindAndReplace, ShowBlocks, Code, CodeBlock, HtmlEmbed, BlockQuote, RemoveFormat,
          Emoji, MediaEmbed, PageBreak, HorizontalLine, BlockToolbar, BalloonToolbar, Autosave, PasteFromOffice,
          GeneralHtmlSupport, ImageToolbar, ImageStyle, ImageResize, ImageTextAlternative, ImageCaption,
          ImageInline, ImageBlock, Table, TableProperties, TableCellProperties, TableColumnResize, TableCaption,
          Underline, Strikethrough, Subscript, Superscript, HtmlComment, Bookmark, PasteFromMarkdownExperimental,
          Mention, SimpleUploadAdapter
        ],
        toolbar: {
          items: [
            'sourceEditing', 'showBlocks', 'findAndReplace', 'fullscreen', '|', 'heading', '|', 'fontSize', 'fontFamily', 'fontColor', 'fontBackgroundColor',
            '|', 'bold', 'italic', 'underline', 'strikethrough', 'subscript', 'superscript', 'code', 'removeFormat',
            '|', 'emoji', 'specialCharacters', 'horizontalLine', 'pageBreak', 'link', 'bookmark',
            'insertImage', 'insertImageViaUrl', 'mediaEmbed', 'insertTable', 'highlight', 'blockQuote', 'codeBlock', 'htmlEmbed',
            '|', 'alignment', '|', 'bulletedList', 'numberedList', 'todoList', 'outdent', 'indent'
          ],
          shouldNotGroupWhenFull: false
        },
        blockToolbar: ['fontSize', 'fontColor', 'fontBackgroundColor', '|', 'bold', 'italic', '|', 'link', 'insertImage', 'insertTable', '|', 'bulletedList', 'numberedList', 'outdent', 'indent'],
        balloonToolbar: ['bold', 'italic', '|', 'link', 'insertImage', '|', 'bulletedList', 'numberedList'],
        fontFamily: { supportAllValues: true },
        fontSize: { options: [10, 12, 14, 'default', 18, 20, 22], supportAllValues: true },
        fullscreen: {
          onEnterCallback: c => {
            c.classList.add('editor-container', 'editor-container_classic-editor', 'editor-container_include-block-toolbar', 'editor-container_include-word-count', 'editor-container_include-fullscreen', 'main-container');
            parent.postMessage({ type: 'full-screen-toggle', data: true }, '*');
          },
          onLeaveCallback: c => parent.postMessage({ type: 'full-screen-toggle', data: false }, '*')
        },
        heading: {
          options: Array.from({ length: 7 }, (_, i) => i === 0
            ? { model: 'paragraph', title: 'Paragraph', class: 'ck-heading_paragraph' }
            : { model: `heading${i}`, view: `h${i}`, title: `Heading ${i}`, class: `ck-heading_heading${i}` })
        },
        htmlSupport: { allow: [{ name: /^.*$/, styles: true, attributes: true, classes: true }] },
        image: {
          toolbar: ['toggleImageCaption', 'imageTextAlternative', '|', 'imageStyle:inline', 'imageStyle:wrapText', 'imageStyle:breakText', '|', 'resizeImage']
        },
        link: {
          addTargetToExternalLinks: true,
          defaultProtocol: 'https://',
          decorators: {
            toggleDownloadable: {
              mode: 'manual',
              label: 'Downloadable',
              attributes: { download: 'file' }
            }
          }
        },
        list: {
          properties: { styles: true, startIndex: true, reversed: true }
        },
        mention: { feeds: [{ marker: '@', feed: [] }] },
        language: 'vi',
        licenseKey: LICENSE_KEY,
        placeholder: 'Nhập nội dung của bạn ở đây',
        translations: [translations],
        initialData: ''
      };

      window.editorInstance = null;

      window.initializeCKEditor = () => {
        ClassicEditor.create(document.querySelector('#editor'), editorConfig).then(editor => {
          window.editorInstance = editor;
          document.querySelector('#editor-word-count').appendChild(editor.plugins.get('WordCount').wordCountContainer);
          editor.model.document.on('change:data', () => {
            parent.postMessage({ type: 'editor-data', data: editor.getData() }, '*');
          });
        });
      };

      window.setContent = html => window.editorInstance?.setData(html);

      window.addEventListener('message', e => {
        if (!allowedOrigins.includes(e.origin)) return;
        const { type, data } = e.data;
        if (type === 'init-editor') window.initializeCKEditor();
        if (type === 'set-content') window.setContent(data.html);
      });

      window.addEventListener('DOMContentLoaded', () => {
        parent.postMessage({ type: 'editor-ready' }, '*');
      });
    });
  </script>
</body>
</html>
